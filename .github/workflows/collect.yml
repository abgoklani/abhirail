name: Nightly seat collector

# Re-checks the trains the family searched in the last 30 days, once a night,
# so AbhiRail learns how far each train's waitlist clears before charting.
# The site caps this at COLLECT_DAILY checks a day (default 300).
on:
  schedule:
    - cron: "40 20 * * *" # 02:10 IST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run collector until done for today
        run: |
          for i in $(seq 1 45); do
            r=$(curl -s --max-time 90 https://rail.abhi.network/api/collect || echo '{}')
            echo "$r"
            echo "$r" | grep -q '"finished":true' && break
            echo "$r" | grep -q '"paused":true' && sleep 60 || sleep 3
          done
